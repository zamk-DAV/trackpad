name: 기능 제안 / Feature request
description: 개선 아이디어를 남겨주세요. / Share an idea for improving Flicklane.
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 어떤 상황에서 필요한가요? / What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 원하는 동작이나 개선안 / Suggested behavior or improvement
    validations:
      required: true
